<script>
/* ---- GitHub Pages mode: when not inside Apps Script, talk to the Web App through fetch ---- */
(function(){if(typeof google!=='undefined'&&google.script)return;
var U=localStorage.getItem('enjaz_url'),T=localStorage.getItem('enjaz_token');
function api(fn,a){
  if(!U||!T) return Promise.reject(new Error('بيانات الاتصال غير مكتملة. أدخل رابط Web App والرمز السري.'));
  return fetch(U,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:a,token:T}),redirect:'follow'})
    .then(function(r){return r.text().then(function(txt){
      var j;
      try{j=JSON.parse(txt)}catch(e){
        throw new Error('استجابة الخادم ليست JSON. تحقق من رابط Web App ومن إعدادات النشر. بداية الاستجابة: '+String(txt).slice(0,140));
      }
      if(!r.ok) throw new Error('تعذر الاتصال بالخادم (HTTP '+r.status+').');
      if(!j.ok) throw new Error(j.error==='Unauthorized'?'الرمز السري غير صحيح':(j.error||'رفض الخادم الطلب'));
      return j.data;
    })})
    .catch(function(e){
      if(e && (e.name==='TypeError' || /Failed to fetch|NetworkError|Load failed/i.test(e.message||''))){
        throw new Error('تعذر الوصول إلى Google Apps Script. قد يكون رابط النشر غير صحيح أو أن المتصفح منع الاتصال بين الموقع وGoogle بسبب إعدادات الوصول أو CORS.');
      }
      throw e;
    });
}
function mk(ok,no){return new Proxy({},{get:function(_,k){if(k==='withSuccessHandler')return function(f){return mk(f,no)};if(k==='withFailureHandler')return function(f){return mk(ok,f)};return function(){api(k,[].slice.call(arguments)).then(ok||function(){},no||function(){})}}})}
window.google={script:{run:mk()}};window.__API=true;
if(!U||!T){document.addEventListener('DOMContentLoaded',function(){document.getElementById('main').innerHTML='<div class="card" style="max-width:520px;margin:auto"><h3>الاتصال بالتطبيق</h3><label class="fl">رابط Web App<input id="lu" placeholder="https://script.google.com/macros/s/.../exec" dir="ltr"></label><label class="fl">الرمز السري<input id="lt" type="password" dir="ltr"></label><button class="b" onclick="localStorage.setItem(\'enjaz_url\',lu.value.trim());localStorage.setItem(\'enjaz_token\',lt.value.trim());location.reload()">دخول</button><p><small>يُحفظ الرابط والرمز في هذا المتصفح فقط.</small></p></div>'});window.__STOP=true}})();
</script>
<script>
if(window.__STOP)throw 'login';

/* Show a readable diagnostic instead of leaving a blank screen on startup errors. */
window.addEventListener('error',function(e){
  console.error('ENJAZ runtime error:',e.error||e.message);
  var m=document.getElementById('main');
  if(m && !window.__STOP) m.innerHTML='<div class="card" style="border:1px solid #d64545"><h2 style="color:#d64545">حدث خطأ أثناء تشغيل التطبيق</h2><p>لم يتم حذف بياناتك. أعد تحميل الصفحة، وإذا تكرر الخطأ أرسل نص الخطأ من وحدة التحكم.</p><small>'+String(e.message||'خطأ JavaScript').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</small><p><button class="b" onclick="location.reload()">إعادة تحميل</button></p></div>';
});
window.addEventListener('unhandledrejection',function(e){
  console.error('ENJAZ async error:',e.reason);
});

var S,tab='cmd',PR={high:'عالية',med:'متوسطة',low:'منخفضة'},ST={New:'جديدة','In Progress':'قيد التنفيذ',Completed:'مكتملة',Deferred:'مؤجلة',Cancelled:'ملغاة'};
var TABS={cmd:'مركز القيادة',tasks:'المهام',proj:'المشاريع',plan:'الجدول',ach:'الإنجازات',set:'الإعدادات'};
function run(fn){var a=[].slice.call(arguments,1);return new Promise(function(ok,no){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){alert(e.message||e);no(e)});r[fn].apply(r,a)})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function load(){
  var m=document.getElementById('main');
  if(m) m.innerHTML='<div class="card" role="status">جارٍ الاتصال بالخادم وتحميل بيانات إنجاز…</div>';
  return run('getState').then(function(s){
    if(!s || !s.settings || !Array.isArray(s.tasks)) throw new Error('وصلت استجابة غير مكتملة من الخادم. تأكد من أن دالة getState تُرجع حالة التطبيق كاملة.');
    S=s; theme(); render(); return s;
  }).catch(function(e){
    console.error('ENJAZ startup/load error:',e);
    var msg=(e&&e.message)?e.message:String(e||'خطأ غير معروف');
    if(m) m.innerHTML='<div class="card" style="max-width:760px;margin:24px auto;border:1px solid #d64545">'
      +'<h2 style="color:#d64545">تعذر تحميل التطبيق</h2>'
      +'<p>لم تُحذف بياناتك. تعذر فقط تحميل الواجهة من الخادم.</p>'
      +'<p><b>سبب المشكلة المحتمل:</b> '+esc(msg)+'</p>'
      +'<div class="row"><button class="b" onclick="load()">إعادة المحاولة</button>'
      +'<button class="s b" onclick="localStorage.removeItem(\'enjaz_url\');localStorage.removeItem(\'enjaz_token\');location.reload()">إعادة إدخال بيانات الاتصال</button></div>'
      +'<small>إذا استمرت المشكلة، راجع رابط النشر الذي ينتهي بـ /exec، وتأكد أن التطبيق منشور ويعمل بالحساب الصحيح.</small></div>';
    return null;
  });
}
function theme(){var r=document.documentElement.style,t=S.settings;r.setProperty('--navy',t.navy);r.setProperty('--gold',t.gold);r.setProperty('--cream',t.cream);
document.body.style.fontFamily=t.font+',Tahoma,sans-serif';document.body.style.fontSize=t.fontSize+'px';document.body.className=t.theme==='dark'?'dark':'';
app.textContent=t.appName;tag.textContent=t.tagline}
function pn(id){var p=S.projects.filter(function(x){return x.id===id})[0];return p?p.name:'—'}
function mins(h){var a=h.split(':');return +a[0]*60+ +a[1]}
function fmt(m){return Math.floor(m/60)+'س '+m%60+'د'}
function open_(t){return t.status!=='Completed'&&t.status!=='Cancelled'&&t.status!=='Deferred'}
function pct(p){var ts=S.tasks.filter(function(t){return t.projectId===p.id});return ts.length?Math.round(ts.filter(function(t){return t.status==='Completed'}).length/ts.length*100):0}
function taskRow(t,x){return '<div class="row"><div class="t"><b>'+esc(t.title)+'</b> <span class="tag">'+PR[t.priority]+'</span> '+(+t.resched?'<span class="tag">مرحّلة '+t.resched+'×</span>':'')+
'<br><small>'+esc(pn(t.projectId))+' · '+ST[t.status]+' · استحقاق '+t.curDue+(t.origDue!==t.curDue?' (أصلي '+t.origDue+')':'')+' · '+t.pct+'%</small></div>'+
(open_(t)?'<button class="b" onclick="go(\'start\',\''+t.id+'\')">ابدأ</button><button class="s b" onclick="go(\'prog\',\''+t.id+'\')">تقدّم</button><button class="b" onclick="go(\'done\',\''+t.id+'\')">أنجزتها</button>':'')+
'<button class="s b" onclick="editTask(\''+t.id+'\')">تعديل</button><button class="s b" onclick="go(\'del\',\''+t.id+'\')">حذف</button></div>'}
function go(a,id){var p;if(a==='start')p=run('startTask',id);else if(a==='done')p=run('completeTask',id);else if(a==='del'){if(!confirm('حذف المهمة؟'))return;p=run('deleteTask',id)}
else{var v=prompt('نسبة الإنجاز 0-100');if(v===null)return;p=run('setProgress',id,Math.min(100,Math.max(0,+v||0)))}p.then(load)}
function score(t){var s={high:30,med:20,low:10}[t.priority]||10;if(t.curDue<S.today)s+=30;if(t.origDue<S.today)s+=15;if(t.curDue===S.today)s+=10;if(t.status==='In Progress')s+=20;return s}
function why(t){var r=[];if(t.origDue<S.today)r.push('مرحّلة من يوم سابق');if(t.status==='In Progress')r.push('قيد التنفيذ');if(t.priority==='high')r.push('أولوية عالية');if(t.curDue===S.today)r.push('مستحقة اليوم');return r.join(' + ')||'أقرب مهمة متاحة'}
function avail(){var d=new Date(S.today+'T12:00:00').getDay(),w=mins(S.settings.dayEnd)-mins(S.settings.dayStart),busy=0,now=new Date(),n=now.getHours()*60+now.getMinutes(),up=[];
S.fixed.forEach(function(f){if(f.days.split(',').indexOf(String(d))>-1){busy+=Math.max(0,Math.min(mins(f.end),mins(S.settings.dayEnd))-Math.max(mins(f.start),mins(S.settings.dayStart)));if(mins(f.end)>n)up.push(f)}});return{free:w-busy,up:up}}
function render(){nav.innerHTML=Object.keys(TABS).map(function(k){return'<button class="'+(k===tab?'on':'')+'" onclick="tab=\''+k+'\';render()">'+TABS[k]+'</button>'}).join('');main.innerHTML=V[tab]()}
var V={
cmd:function(){var T=S.tasks,td=T.filter(function(t){return open_(t)&&t.curDue<=S.today}).sort(function(a,b){return score(b)-score(a)}),car=T.filter(function(t){return open_(t)&&+t.resched>0&&t.curDue===S.today}),
dn=S.ach.filter(function(a){return a.doneDate===S.today}),dm=dn.reduce(function(a,x){return a+ +x.minutes},0),av=avail(),pl=td.filter(function(t){return!isFx(t)}).reduce(function(a,t){return a+ +t.estMin},0),all=td.length+dn.length,
wk=S.ach.filter(function(a){return(new Date(S.today)-new Date(a.doneDate))/864e5<7}).length,top=td[0];
return'<div class="card"><h2>مركز القيادة — ماذا أفعل الآن؟</h2><div id="clk"></div>'+(top?'<h3>'+esc(top.title)+'</h3><p>السبب: '+why(top)+'</p><button class="b big" onclick="go(\'start\',\''+top.id+'\')">ابدأ المهمة الآن</button> <small>(اختيارية — يمكنك اختيار مهمة أخرى أدناه)</small>':'<p>لا مهام مستحقة. أضف مهمة من تبويب المهام.</p>')+'</div>'+
'<div class="grid"><div class="card stat"><b>'+dn.length+'</b>منجزة اليوم</div><div class="card stat"><b>'+td.length+'</b>متبقية</div><div class="card stat"><b>'+(all?Math.round(dn.length/all*100):0)+'%</b>إنجاز اليوم</div><div class="card stat"><b>'+wk+'</b>منجزة آخر 7 أيام</div><div class="card stat"><b>'+fmt(av.free)+'</b>وقت متاح</div><div class="card stat"><b>'+fmt(dm)+'</b>وقت مستغرق</div><div class="card stat"><b>'+S.points+'</b>نقاط</div></div>'+
(pl>av.free?'<div class="card warn">تنبيه: المهام المخططة ('+fmt(pl)+') تتجاوز الوقت المتاح ('+fmt(av.free)+')</div>':'')+
